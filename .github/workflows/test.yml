name: test

# A pull request's commits are tested once, through the pull request; main
# and the release tags as they are pushed. A newer push to the same pull
# request cancels the run it supersedes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What needs no ucode runs beside the tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The UI has no build step (0042); check every module parses and its
      # imports link. app.js touches the page when it loads, so it is only
      # parsed.
      - name: the UI's modules link
        working-directory: internal/ui/static
        run: |
          node --check app.js
          for f in api.js dom.js format.js layout.js refresh.js views/*.js; do
            node --input-type=module -e "await import('./$f')"
          done
      # Loading a module does not resolve names used inside its functions, so
      # a call to one that no longer exists passed the check above (v0.20.0's
      # Interfaces tab). ESLint's no-undef catches that, and only that.
      - name: the UI uses no undefined names
        working-directory: internal/ui/static
        run: |
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options=sourceType:module --parser-options=ecmaVersion:2022 --rule 'no-undef: error' .
      - name: the agent's shell scripts parse
        run: for f in agent/install.sh agent/files/etc/init.d/aeolus agent/files/usr/libexec/aeolus-packages agent/files/etc/hotplug.d/ntp/50-aeolus; do sh -n "$f"; done

  test:
    runs-on: ubuntu-latest
    env:
      UCODE_COMMIT: "85922056"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The agent's renderer is tested against the manager's check (0040):
      # build ucode as OpenWrt 25.12 ships it (the version on PumphouseAP),
      # with only the modules the renderer and its test use. The build is
      # kept by its commit, so it is made once.
      - name: ucode's build, kept
        id: ucode-cache
        uses: actions/cache@v4
        with:
          path: ~/.ucode
          key: ucode-${{ runner.os }}-${{ env.UCODE_COMMIT }}-v1
      - name: ucode
        run: |
          sudo apt-get install -y --no-install-recommends cmake libjson-c-dev
          if [ "${{ steps.ucode-cache.outputs.cache-hit }}" != "true" ]; then
            git clone --filter=blob:none https://github.com/jow-/ucode.git /tmp/ucode
            git -C /tmp/ucode checkout "$UCODE_COMMIT"
            cmake -S /tmp/ucode -B /tmp/ucode/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.ucode" \
              -DFS_SUPPORT=ON -DMATH_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF \
              -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DSTRUCT_SUPPORT=OFF \
              -DULOOP_SUPPORT=OFF -DLOG_SUPPORT=OFF -DSOCKET_SUPPORT=OFF -DZLIB_SUPPORT=OFF \
              -DDIGEST_SUPPORT=OFF -DDEBUG_SUPPORT=OFF
            cmake --build /tmp/ucode/build -j
            cmake --install /tmp/ucode/build
          fi
          echo "$HOME/.ucode/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.ucode/lib" >> "$GITHUB_ENV"
      - name: ucode works
        run: ucode -e 'print("ucode works\n")'
      - run: go test -race -cover ./...
      - name: the agent renders its expected output, and builds the prober's frames
        run: |
          go test -count=1 -v -run 'Agent' ./internal/rendercheck/ | tee /tmp/agent.log
          grep -q -- '--- PASS: TestAgentRendersItsOutput' /tmp/agent.log
          grep -q -- '--- PASS: TestAgentProbeFrames' /tmp/agent.log

  # Keep the later port to APs possible (0019): the manager must still build for AP hardware.
  build-ap-targets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm64 }
          - { goarch: arm, goarm: "7" }
          - { goarch: mipsle, gomips: softfloat }
          - { goarch: mips, gomips: softfloat }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
