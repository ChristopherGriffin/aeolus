name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The agent's renderer is tested against the manager's check (0040):
      # build ucode as OpenWrt 25.12 ships it (the version on PumphouseAP),
      # with only the modules the renderer and its test use.
      - name: ucode
        run: |
          sudo apt-get install -y --no-install-recommends cmake libjson-c-dev
          git clone --filter=blob:none https://github.com/jow-/ucode.git /tmp/ucode
          git -C /tmp/ucode checkout 85922056
          cmake -S /tmp/ucode -B /tmp/ucode/build -DCMAKE_BUILD_TYPE=Release \
            -DFS_SUPPORT=ON -DMATH_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF -DSTRUCT_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF -DLOG_SUPPORT=OFF -DSOCKET_SUPPORT=OFF -DZLIB_SUPPORT=OFF \
            -DDIGEST_SUPPORT=OFF -DDEBUG_SUPPORT=OFF
          cmake --build /tmp/ucode/build -j
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig
          ucode -e 'print("ucode works\n")'
      - run: go test -race -cover ./...
      - name: the agent renders its expected output
        run: go test -count=1 -v -run 'Agent' ./internal/rendercheck/ | tee /dev/stderr | grep -q -- '--- PASS: TestAgentRendersItsOutput'
      # The UI has no build step (0042); check every module parses and its
      # imports link. app.js touches the page when it loads, so it is only
      # parsed.
      - name: the UI's modules link
        working-directory: internal/ui/static
        run: |
          node --check app.js
          for f in api.js dom.js format.js layout.js refresh.js views/*.js; do
            node --input-type=module -e "await import('./$f')"
          done
      - name: the agent's shell scripts parse
        run: for f in agent/install.sh agent/files/etc/init.d/aeolus; do sh -n "$f"; done

  # Keep the later port to APs possible (0019): the manager must still build for AP hardware.
  build-ap-targets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm64 }
          - { goarch: arm, goarm: "7" }
          - { goarch: mipsle, gomips: softfloat }
          - { goarch: mips, gomips: softfloat }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
