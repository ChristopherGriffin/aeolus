name: merge when green

# Griff approves a pull request with "merge when green", and Claude puts the
# merge-when-green label on it. It is merged, with a merge commit, once the
# test workflow has passed on the very commit the pull request carries: by
# that run itself, at its end, or here, when the label goes on after it. A
# push after the label takes the label off, so a commit nobody approved is
# never merged. The merging is .github/merge-when-green.sh.
#
# CI tests a pull request merged into its base as the base was then. So only
# a pull request whose head already holds the base's tip is merged, whose
# merge is then what CI tested; if the base has moved on, it says so on the
# pull request and leaves it. A merge made with a workflow's token starts no
# workflow, so main isn't tested again after it.
#
# Neither job here starts unless its condition holds, so a pull request
# without the label costs no minutes here.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # A push after the label voids the approval.
  unlabel:
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'merge-when-green')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label merge-when-green
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  merge:
    if: github.event.action == 'labeled' && github.event.label.name == 'merge-when-green'
    concurrency:
      group: merge-when-green-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: merge, if green on its head and holding its base's tip
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          WAIT: "90"
        run: bash .github/merge-when-green.sh
