name: merge when green

# Griff approves a pull request with "merge when green", and Claude puts the
# merge-when-green label on it. The label's job marks the head it was put on
# approved, with a commit status, merge-when-green. The pull request is
# merged, with a merge commit, once the test workflow has passed on that
# very commit: by that run itself, at its end, or here, when the label goes
# on after it. Only an approved head is merged, so a push after the label is
# never merged, however its run and the label's removal fall; the push takes
# the label off too. The merging is .github/merge-when-green.sh.
#
# Pull requests come from this repository's own branches. One from a fork
# gets a read-only token, so it is merged by hand.
#
# CI tests a pull request merged into its base as the base was then. So only
# a pull request whose head already holds the base's tip is merged, whose
# merge is then what CI tested; if the base has moved on, it says so on the
# pull request and leaves it. A merge made with a workflow's token starts no
# workflow, so main isn't tested again after it.
#
# Neither job here starts unless its condition holds, and both run on
# talos, the self-hosted runner, as the tests do.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: read
  statuses: write

jobs:
  # A push after the label voids the approval.
  unlabel:
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'merge-when-green')
    runs-on: [self-hosted, linux, x64, talos]
    timeout-minutes: 5
    steps:
      # By REST: the runner's gh pr edit also asks GraphQL for the pull
      # request's classic project cards, which GitHub now refuses.
      - run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/merge-when-green" --silent
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  merge:
    if: github.event.action == 'labeled' && github.event.label.name == 'merge-when-green'
    concurrency:
      group: merge-when-green-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, talos]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # The head the label went on, as the event says, even if another push
      # came since.
      - name: approve the head the label went on
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ github.event.pull_request.head.sha }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$APPROVED" -f state=success -f context=merge-when-green -f description="approved for merging"
      - name: merge, if green on its head and holding its base's tip
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          WAIT: "90"
        run: bash .github/merge-when-green.sh
